<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaper Embedding Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1e293b;
        background-color: #f1f5f9;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 24px;
        color: #0f172a;
      }
      .subtitle {
        margin: 0;
        color: #64748b;
        font-size: 14px;
      }
      .filter-bar {
        background: #ffffff;
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filter-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .filter-note {
        font-size: 13px;
        color: #64748b;
      }
      label {
        font-weight: 600;
        font-size: 14px;
        color: #334155;
      }
      select {
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        background-color: #fff;
        color: #1e293b;
        cursor: pointer;
      }
      select:focus {
        outline: none;
        border-color: #3b82f6;
      }
      .variable-badge {
        margin-left: auto;
        font-size: 13px;
        color: #475569;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 6px 12px;
        border-radius: 6px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #0284c7;
      }
      #dashboard-container {
        background: #ffffff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Healthcare Insurance Analytics</h1>
        <p class="subtitle">Demonstrating embedded Shaper dashboard with server-side JWT preset variables</p>
      </header>

      <div class="filter-bar">
        <div class="filter-group">
          <div class="filter-control">
            <label for="insurance-select">Insurance:</label>
            <select id="insurance-select">
              <option value="medicare">Medicare</option>
              <option value="aetna">Aetna</option>
              <option value="cigna">Cigna</option>
              <option value="unitedhealthcare">UnitedHealthcare</option>
              <option value="blue_cross">Blue Cross</option>
            </select>
          </div>
          <span class="filter-note">
            Select an insurance to see the page as if you are signed in as a user with the scope of that insurance.
          </span>
        </div>
        <div class="variable-badge">
          JWT Variables: <code id="var-display">{"insurance_id": "medicare"}</code>
        </div>
      </div>

      <div id="dashboard-container" style="height: auto">
        <p style="padding: 24px; color: #64748b;">Loading embedded dashboard...</p>
      </div>
    </div>

    <script src="$BASE_URL/embed/shaper.js"></script>

    <script>
      function storeVarsInQuery(param, vars) {
        const url = new URL(window.location.toString());
        url.searchParams.set(param, encodeURIComponent(JSON.stringify(vars)));
        history.pushState(null, "", url);
      }
      function varsFromQuery(param) {
        const params = new URL(window.location.toString()).searchParams;
        const p = params.get(param);
        if (!p) {
          return undefined;
        }
        return JSON.parse(decodeURIComponent(p));
      }

      const dashboardId = "$DASHBOARD_ID";
      const select = document.getElementById("insurance-select");
      const varDisplay = document.getElementById("var-display");

      // Initialize insurance from URL query param if present
      const initialParams = new URL(window.location.toString()).searchParams;
      let currentInsurance = initialParams.get("insurance") || select.value;
      select.value = currentInsurance;

      let activeDashboard = null;

      function loadDashboard(insuranceId) {
        varDisplay.textContent = JSON.stringify({ insurance_id: insuranceId });
        const container = document.getElementById("dashboard-container");
        container.innerHTML = "";

        activeDashboard = shaper.dashboard({
          container,
          dashboardId,
          vars: varsFromQuery("analytics"),
          async getJwt() {
            const res = await fetch("/api/jwt", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ insurance_id: insuranceId }),
            });
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.error || "Failed to get JWT");
            }
            return data;
          },
          onVarsChanged(newVars) {
            storeVarsInQuery("analytics", newVars);
          }
        });
      }

      select.addEventListener("change", (e) => {
        const insuranceId = e.target.value;
        const url = new URL(window.location.toString());
        url.searchParams.set("insurance", insuranceId);
        url.searchParams.delete("analytics");
        history.pushState(null, "", url);
        loadDashboard(insuranceId);
      });

      window.addEventListener("popstate", () => {
        const params = new URL(window.location.toString()).searchParams;
        const ins = params.get("insurance") || "medicare";
        if (select.value !== ins) {
          select.value = ins;
          loadDashboard(ins);
        }
      });

      loadDashboard(currentInsurance);
    </script>
  </body>
</html>
